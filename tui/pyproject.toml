[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# Prefixed for the same reason as magmacrunch-thld and magmacrunch-jhc: PyPI
# has no scoping like the npm @magmacrunch/… packages, so the distribution is
# namespaced. The import package stays plain `tron`, matching the one-word
# habit of `boole`, `drift` and `lavadome` — it is what you type in code, and
# it competes for nothing.
name = "magmacrunch-roderick-tron"
version = "0.1.0"
description = "Roderick Tron — terminal version"
readme = "README.md"
license = "PolyForm-Noncommercial-1.0.0"
requires-python = ">=3.10"
authors = [{ name = "magmacrunch media" }]

# The engine, with its terminal backend.
#
# 0.7.1 rather than 0.7.0: 0.7.0 shipped the glyph fallback with the launcher's
# own box-drawing characters missing from the table. This game leans on that
# table harder than any cabinet so far — the playfield is drawn out of block
# and box glyphs — so the floor is the release where the table is complete.
#
# The rules do not need any of it. tron/config.py, tilemap.py, player.py,
# entities.py and cells.py import nothing outside the standard library, and
# tests/test_physics.py runs with nothing but pytest on the machine, which is
# what proves it.
dependencies = ["magmacrunch>=0.7.1"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.6"]

[project.scripts]
roderick-tron = "tron.__main__:main"

# Found by a launcher enumerating installed games. Declaring it costs nothing
# when the game is run on its own, and is the whole of what makes it appear in
# an arcade menu — see magmacrunch.engine.arcade.
#
# Held back until the screens existed, because an entry point is metadata
# nothing validates at install time: declared early, the package installs
# cleanly and then `magmacrunch --list` reports a cabinet that cannot be
# loaded. tests/test_packaging.py checks the target by reading this file rather
# than importing it, so the check needs no engine either.
[project.entry-points."magmacrunch.games"]
roderick-tron = "tron.arcade:GAME"

[tool.hatch.build.targets.wheel]
packages = ["tron"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ARG"]

[tool.pytest.ini_options]
testpaths = ["tests"]
